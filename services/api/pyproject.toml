[project]
name = "oral-video-agent-api"
version = "0.1.0"
description = "FastAPI backend for the intelligent oral video agent"
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic==0.72.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.32.1",
    "yt-dlp>=2024.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv]
package = false

[tool.uv.sources]

[project.scripts]
oral-video-api = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
