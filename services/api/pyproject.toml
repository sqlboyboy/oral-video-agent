[project]
name = "oral-video-agent-api"
version = "0.1.0"
description = "FastAPI backend for the intelligent oral video agent"
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic==0.72.0",
    "av>=17.0.1",
    "fastapi==0.115.6",
    "faster-whisper==1.1.1",
    "httpx==0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "librosa>=0.11.0",
    "opencv-contrib-python-headless>=4.12.0.88,<4.13",
    "playwright>=1.60.0",
    "pydantic==2.10.4",
    "python-dotenv>=1.2.2",
    "python-multipart==0.0.20",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "uvicorn[standard]==0.32.1",
    "yt-dlp>=2024.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv]
package = false

[tool.uv.sources]

[project.scripts]
oral-video-api = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
