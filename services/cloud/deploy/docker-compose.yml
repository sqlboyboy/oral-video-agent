services:
  postgres:
    image: postgres:16-alpine
    container_name: oral-video-cloud-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oral_video_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-oral_video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-postgres-password}
    volumes:
      - /var/lib/oral-video-agent/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: oral-video-cloud-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /var/lib/oral-video-agent/redis:/data

  cloud-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oral-video-cloud-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/lib/oral-video-agent/cloud:/data
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:18080:8000"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oral-video-cloud-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - .env
    volumes:
      - /var/lib/oral-video-agent/cloud:/data
    depends_on:
      - cloud-api

  nginx:
    image: nginx:1.27-alpine
    container_name: oral-video-cloud-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloud-api
    ports:
      - "${CLOUD_NGINX_BIND:-80}:80"
